name: Feature request
description: Suggest an improvement for job seekers or employers
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired experience.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Job seekers
        - Employers
        - Administrators
        - Everyone
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Kannada, accessibility, privacy, or safety considerations
